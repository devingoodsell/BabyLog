# Runs the browser tests (tests/run.js) on every push and pull request.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04   # Playwright 1.56 supports 24.04; ubuntu-latest moved to 26.04
    timeout-minutes: 30
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm ci --prefix google-home --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
