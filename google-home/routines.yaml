# Baby Log voice commands for the Google Home script editor (home.google.com > Automations > Add new).
# Say "Hey Google, <phrase>" to any speaker. Each phrase activates the matching Baby Log scene.
# The confirmation plays on whichever speaker heard you; the devices line just has to name a real speaker.
metadata:
  name: Baby Log voice commands
  description: Say "Hey Google, log a wet diaper" (and so on) to log diapers and bottles in Baby Log
automations:
  # log a wet diaper
  - starters:
      - type: assistant.event.OkGoogle
        eventData: query
        is: log a wet diaper
    actions:
      - type: assistant.command.OkGoogle
        okGoogle: activate Baby Log wet diaper
        devices: Office speaker - Office
  # log a dirty diaper
  - starters:
      - type: assistant.event.OkGoogle
        eventData: query
        is: log a dirty diaper
    actions:
      - type: assistant.command.OkGoogle
        okGoogle: activate Baby Log dirty diaper
        devices: Office speaker - Office
  # log a wet and dirty diaper
  - starters:
      - type: assistant.event.OkGoogle
        eventData: query
        is: log a wet and dirty diaper
    actions:
      - type: assistant.command.OkGoogle
        okGoogle: activate Baby Log dirty and wet diaper
        devices: Office speaker - Office
